name: HealthOSApp
options:
  bundleIdPrefix: com.lucacuccia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"

targets:
  HealthOSApp:
    type: application
    platform: iOS
    sources:
      - HealthOSApp
    settings:
      base:
        INFOPLIST_FILE: HealthOSApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lucacuccia.healthos-app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 8
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "" # your Apple team ID
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - target: RestTimerWidgetExtension
        embed: true
        codeSign: true

  RestTimerWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: RestTimerWidgetExtension
      - path: HealthOSApp/LiveActivity/RestTimerAttributes.swift
    settings:
      base:
        INFOPLIST_FILE: RestTimerWidgetExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lucacuccia.healthos-app.RestTimerWidgetExtension
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 8
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "" # your Apple team ID
        SKIP_INSTALL: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
